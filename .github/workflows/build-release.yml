name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v0.1.1；留空使用 package.json）；store 构建 Windows Store；mac-store 上传 Mac App Store；linux-store-build 仅构建 Snap；linux-store 发布 Snap stable'
        required: false
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  build-windows-store:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version == 'store'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Build unsigned Microsoft Store packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: yarn build:store:win

      - name: Upload Microsoft Store packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-store-packages
          path: dist/AI-Gist-*-Windows-Store-*.appx
          if-no-files-found: error

  build-mac-store:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version == 'mac-store'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - run: yarn install --frozen-lockfile

      - name: Install Mac App Store signing certificates
        env:
          MAS_APP_CERT_P12_BASE64: ${{ secrets.MAS_APP_CERT_P12_BASE64 }}
          MAS_APP_CERT_PASSWORD: ${{ secrets.MAS_APP_CERT_PASSWORD }}
          MAS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAS_INSTALLER_CERT_P12_BASE64 }}
          MAS_INSTALLER_CERT_PASSWORD: ${{ secrets.MAS_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/mac-app-store-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          printf '%s' "$MAS_APP_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mas-app.p12"
          printf '%s' "$MAS_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mas-installer.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/mas-app.p12" -P "$MAS_APP_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/mas-installer.p12" -P "$MAS_INSTALLER_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install Mac App Store provisioning profile
        env:
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          MAS_PROVISIONING_PROFILE_PATH="$RUNNER_TEMP/AI_Gist_Mac_App_Store.provisionprofile"
          printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$MAS_PROVISIONING_PROFILE_PATH"
          security cms -D -i "$MAS_PROVISIONING_PROFILE_PATH" > "$RUNNER_TEMP/mas-profile.plist"
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/mas-profile.plist")
          if [[ "$PROFILE_APP_ID" != '9T93J5B7N6.com.getaigist.app' ]]; then
            echo "::error::Unexpected Mac App Store provisioning profile: $PROFILE_APP_ID"
            exit 1
          fi
          echo "MAS_PROVISIONING_PROFILE_PATH=$MAS_PROVISIONING_PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Build signed Mac App Store package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          PYTHON: python3
          npm_config_python: python3
        run: |
          node scripts/build.js
          # CFBundleVersion 必须比同一营销版本号下上一次上传 App Store Connect
          # 的 build 号更高，否则上传报 -19241。构建号取 package.json 的
          # buildRevision（见 scripts/version.js），每个版本号从 1 开始数，不用
          # run_number——那样每跑一次流水线就跳一大截。营销版本号
          # （CFBundleShortVersionString）就是 package.json 的 version，商店里
          # 显示为 "2.1.1 (1)" 的形式。
          BUILD_NUMBER=$(node scripts/version.js --build)
          yarn electron-builder --config config/electron-builder.mas.js --mac --universal --publish never \
            --config.mas.provisioningProfile="$MAS_PROVISIONING_PROFILE_PATH" \
            --config.buildVersion="$BUILD_NUMBER"

          PKG_PATH=$(find dist -type f -name 'AI-Gist-*-Mac-App-Store-*.pkg' -print -quit)
          if [[ -z "$PKG_PATH" ]]; then
            echo '::error::Mac App Store package was not produced.'
            exit 1
          fi
          pkgutil --check-signature "$PKG_PATH"
          echo "MAS_PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"

      - name: Upload Mac App Store package artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-app-store-package
          path: dist/**/AI-Gist-*-Mac-App-Store-*.pkg
          if-no-files-found: error

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if xcrun --find altool >/dev/null 2>&1; then
            xcrun altool --validate-app --type macos --file "$MAS_PKG_PATH" \
              --username "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
            xcrun altool --upload-app --type macos --file "$MAS_PKG_PATH" \
              --username "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          else
            TRANSPORTER=$(xcrun --find iTMSTransporter)
            "$TRANSPORTER" -m verify -assetFile "$MAS_PKG_PATH" \
              -u "$APPLE_ID" -p "$APPLE_APP_SPECIFIC_PASSWORD" -v informational
            "$TRANSPORTER" -m upload -assetFile "$MAS_PKG_PATH" \
              -u "$APPLE_ID" -p "$APPLE_APP_SPECIFIC_PASSWORD" -v informational
          fi

      - name: Cleanup signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  build-linux-store:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.version == 'linux-store-build' || github.event.inputs.version == 'linux-store')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Build Snap package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: yarn build:store:linux

      - name: Locate Snap package
        id: snap
        shell: bash
        run: |
          SNAP_PATH=$(find dist -maxdepth 1 -type f -name 'AI-Gist-*-Linux-Snap-amd64.snap' -print -quit)
          if [[ -z "$SNAP_PATH" ]]; then
            echo '::error::Snap package was not produced.'
            exit 1
          fi
          echo "path=$SNAP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-snap-package
          path: ${{ steps.snap.outputs.path }}
          if-no-files-found: error

      - name: Publish to Snap Store stable channel
        if: github.event.inputs.version == 'linux-store'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: stable

  create-release:
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.version != 'store' && github.event.inputs.version != 'mac-store' && github.event.inputs.version != 'linux-store-build' && github.event.inputs.version != 'linux-store')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Get version
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"

          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="$TAG_VERSION"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$PACKAGE_VERSION"
          fi

          if [[ "$VERSION" != v* ]]; then
            VERSION="v$VERSION"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Use v1.2.3 or 1.2.3."
            exit 1
          fi

          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Release version '$VERSION' must match package.json version '$PACKAGE_VERSION'. Update package.json first."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify manual release tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_VERSION does not exist. Push the version tag first, then run this workflow."
            exit 1
          fi

          # Annotated tags expose the target commit through the peeled ^{} ref;
          # lightweight tags expose the commit directly on refs/tags/<version>.
          REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/$RELEASE_VERSION^{}" | awk 'NR == 1 { print $1 }')
          if [[ -z "$REMOTE_TAG_SHA" ]]; then
            REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/$RELEASE_VERSION" | awk 'NR == 1 { print $1 }')
          fi
          CHECKOUT_SHA=$(git rev-parse HEAD)

          if [[ "$REMOTE_TAG_SHA" != "$CHECKOUT_SHA" ]]; then
            echo "::error::Tag $RELEASE_VERSION points to $REMOTE_TAG_SHA, but this workflow checked out $CHECKOUT_SHA. Dispatch the workflow from the tagged commit."
            exit 1
          fi

          echo "Using existing tag $RELEASE_VERSION at $CHECKOUT_SHA; no tag will be created or pushed."

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: AI Gist ${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📦 安装说明（遇到「损坏 / 无法验证开发者 / SmartScreen」提示请看这里）

            **Windows**：下载 `AI-Gist-*-Windows-Setup.exe`。若出现 Microsoft Defender SmartScreen 蓝色提示，点击「更多信息」→「仍要运行」即可继续安装。文件名带 `-unsigned` 后缀的安装包为未签名兼容构建，出现该提示属预期行为。

            **macOS**：请按芯片下载（Apple Silicon → `arm64`，Intel → `x64`）。正式版均已使用 Apple Developer ID 签名并通过 Apple 公证，可直接安装。若使用文件名带 `-unsigned` 后缀的兼容包时提示「已损坏，无法打开」，请先将应用拖入「应用程序」文件夹，再在终端执行：

            ```bash
            xattr -cr "/Applications/AI Gist.app"
            ```

            **Linux (AppImage)**：下载后先赋予执行权限再运行：

            ```bash
            chmod +x AI-Gist-*-linux.AppImage
            ```

            Ubuntu 22.04 及以上版本如提示缺少 FUSE，请先安装 libfuse2：`sudo apt install libfuse2`

            ---

  build-mac:
    needs: create-release
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - run: yarn install --frozen-lockfile
      - run: npm install -g typescript

      - name: Check macOS signing configuration
        id: mac-signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MISSING=()
          [[ -z "$MAC_CSC_LINK" ]] && MISSING+=(MAC_CSC_LINK)
          [[ -z "$MAC_CSC_KEY_PASSWORD" ]] && MISSING+=(MAC_CSC_KEY_PASSWORD)
          [[ -z "$APPLE_ID" ]] && MISSING+=(APPLE_ID)
          [[ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]] && MISSING+=(APPLE_APP_SPECIFIC_PASSWORD)
          [[ -z "$APPLE_TEAM_ID" ]] && MISSING+=(APPLE_TEAM_ID)

          if [[ ${#MISSING[@]} -eq 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            {
              echo "### macOS (${{ matrix.arch }}) 签名状态：✅ 将执行 Developer ID 签名 + Apple 公证"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing credentials are incomplete (missing: ${MISSING[*]}); publishing an unsigned compatibility build."
            {
              echo "### macOS (${{ matrix.arch }}) 签名状态：⚠️ 未签名兼容构建"
              echo ""
              echo "缺少 Secrets：\`${MISSING[*]}\`"
              echo ""
              echo "产物将以 \`-unsigned\` 后缀发布（仅 ad-hoc 签名，未公证），用户需执行 \`xattr -cr\` 才能打开。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build, sign, notarize, and publish (macOS)
        if: steps.mac-signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PYTHON: python3
          npm_config_python: python3
        run: |
          node scripts/build.js
          yarn electron-builder --config config/electron-builder.json --mac --${{ matrix.arch }} --config.mac.notarize=true --publish always

      - name: Verify macOS signature and notarization
        if: steps.mac-signing.outputs.available == 'true'
        shell: bash
        run: |
          APP_PATH=$(find dist -maxdepth 2 -type d -name '*.app' -print -quit)
          if [[ -z "$APP_PATH" ]]; then
            echo '::error::Built .app was not found for signature verification.'
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          echo "- ✅ \`$APP_PATH\` 通过 codesign 校验、公证票据（staple）校验与 Gatekeeper 评估" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and publish unsigned compatibility package (macOS)
        if: steps.mac-signing.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          PYTHON: python3
          npm_config_python: python3
        run: |
          node scripts/build.js
          yarn electron-builder --config config/electron-builder.json --mac --${{ matrix.arch }} --publish always \
            --config.afterSign=scripts/adhoc-sign-mac.js \
            --config.mac.artifactName='AI-Gist-${version}-macOS-${arch}-unsigned.${ext}'

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - run: yarn install --frozen-lockfile
      - run: npm install -g typescript

      - name: Build unsigned Windows installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node scripts/build.js
          yarn electron-builder --config config/electron-builder.json --win --publish never

      - name: Check SignPath configuration
        id: signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) { $missing += 'SIGNPATH_API_TOKEN' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) { $missing += 'SIGNPATH_ORGANIZATION_ID' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG)) { $missing += 'SIGNPATH_PROJECT_SLUG' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_POLICY_SLUG)) { $missing += 'SIGNPATH_SIGNING_POLICY_SLUG' }

          if ($missing.Count -eq 0) {
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "### Windows 签名状态：✅ 将提交 SignPath 签名请求" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning ("SignPath credentials are incomplete (missing: {0}); publishing an unsigned compatibility build." -f ($missing -join ', '))
            "### Windows 签名状态：⚠️ 未签名兼容构建" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            ("缺少 Secrets：``{0}``" -f ($missing -join ', ')) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "安装包将以 ``-unsigned`` 后缀发布，安装时会触发 SmartScreen 提示（更多信息 → 仍要运行）。" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload unsigned installer for origin verification
        if: steps.signpath.outputs.available == 'true'
        id: upload-unsigned-windows
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installer
          path: dist/AI-Gist-*-Windows-Setup.exe
          if-no-files-found: error

      - name: Submit Windows installer to SignPath
        if: steps.signpath.outputs.available == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed

      - name: Publish Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          SIGNED: ${{ steps.signpath.outputs.available }}
        run: |
          if ($env:SIGNED -eq 'true') {
            $installer = Get-ChildItem -Path dist/signed -Filter 'AI-Gist-*-Windows-Setup.exe' -Recurse | Select-Object -First 1
            if (-not $installer) {
              throw 'Signed Windows installer was not found.'
            }

            $sig = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($sig.Status -ne 'Valid') {
              throw "Signed installer failed Authenticode verification: $($sig.Status) $($sig.StatusMessage)"
            }
            ("- ✅ Authenticode 校验通过，签名者：``{0}``" -f $sig.SignerCertificate.Subject) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            $installer = Get-ChildItem -Path dist -Filter 'AI-Gist-*-Windows-Setup.exe' | Select-Object -First 1
            if (-not $installer) {
              throw 'Windows installer was not found.'
            }

            $unsignedName = $installer.Name -replace '\.exe$', '-unsigned.exe'
            $installer = Rename-Item -Path $installer.FullName -NewName $unsignedName -PassThru
          }

          gh release upload $env:RELEASE_VERSION $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - run: yarn install --frozen-lockfile
      - run: npm install -g typescript

      - name: Build and Publish (Linux)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node scripts/build.js
          yarn electron-builder --config config/electron-builder.json --linux --publish always

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile
      - run: npm install -g typescript

      # Android 的 versionCode/versionName 写在 build.gradle 里，靠
      # scripts/sync-version.js 与 package.json 保持一致，这里防止忘记同步。
      - name: Verify native version numbers
        run: yarn version:check

      - name: Build mobile web assets
        run: yarn build:mobile

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Fix Gradle distribution URL
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Check signing configuration
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode Keystore
        if: steps.signing.outputs.available == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build Signed Release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEY_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build Debug APK (No Signing Config)
        if: steps.signing.outputs.available != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Collect and rename APK
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" "AI-Gist-${VERSION}-android.apk"

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload "$VERSION" AI-Gist-*.apk \
            --repo ${{ github.repository }} \
            --clobber
